[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mvp-tdem"
version = "0.1.0"
description = "Airborne TDEM processing and 1D/2D inversion pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "SimPEG",
    "empymod",
    "matplotlib",
    "plotly",
    "click",
    "pyyaml",
    "pyproj",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff"]
ui  = ["streamlit>=1.35", "plotly>=5.20", "kaleido"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
